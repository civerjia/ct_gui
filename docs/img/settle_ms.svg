  <text x="722" y="274" font-family="system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,&quot;Helvetica Neue&quot;,Arial,sans-serif" font-size="14" font-weight="400" fill="#64748b" text-anchor="start">settled: on_armed + trigger</text>
  <text x="24" y="336" font-family="system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,&quot;Helvetica Neue&quot;,Arial,sans-serif" font-size="15" font-weight="600" fill="#1e293b" text-anchor="start">scan_view(settle_ms=...): HOT, from the FIRST arrival</text>
