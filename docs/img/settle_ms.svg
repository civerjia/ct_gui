  <text x="24" y="236" font-family="system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,&quot;Helvetica Neue&quot;,Arial,sans-serif" font-size="15" font-weight="600" fill="#1e293b" text-anchor="start">fire_single_pulse(settle_ms=...): held CONTINUOUSLY</text>
