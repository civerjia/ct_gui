  <text x="422" y="274" font-family="system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,&quot;Helvetica Neue&quot;,Arial,sans-serif" font-size="14" font-weight="600" fill="#b91c1c" text-anchor="start">restarts</text>
  <line x1="480" y1="270" x2="710" y2="270" stroke="#475569" stroke-width="3"/>
