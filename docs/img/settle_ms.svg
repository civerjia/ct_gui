<svg xmlns="http://www.w3.org/2000/svg" width="940" height="420" viewBox="0 0 940 420" role="img" aria-label="settle_ms: fire_single_pulse vs scan_view">
  <title>settle_ms: fire_single_pulse vs scan_view</title>
