  <rect x="60" y="61" width="820" height="18" rx="0" fill="#e2e8f0"/>
  <text x="66" y="57" font-family="system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,&quot;Helvetica Neue&quot;,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#64748b" text-anchor="start">ACTIVE_MV &#177; 150 mV (arrived)</text>
  <text x="54" y="194" font-family="system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,&quot;Helvetica Neue&quot;,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#64748b" text-anchor="end">IDLE</text>
  <path d="M60,190 L100,190 C180,190 190,100 250,79 C264,75 276,71 294,71 L380,71 C400,72 404,96 420,96 L450,96 C466,96 470,71 490,70 L880,70 L880,70" fill="none" stroke="#0f766e" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
