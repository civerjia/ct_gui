<svg xmlns="http://www.w3.org/2000/svg" width="940" height="280" viewBox="0 0 940 280" role="img" aria-label="fire_single_pulse: ARM, triggers and their limits">
  <title>fire_single_pulse: ARM, triggers and their limits</title>
  <rect width="940" height="280" fill="#ffffff"/>
  <line x1="60" y1="90" x2="890" y2="90" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="330" y="60" width="30" height="30" rx="2" fill="#334155"/>
  <rect x="470" y="60" width="30" height="30" rx="2" fill="#334155"/>
  <rect x="610" y="60" width="30" height="30" rx="2" fill="#334155"/>
  <rect x="750" y="60" width="30" height="30" rx="2" fill="#334155"/>
  <line x1="90" y1="38" x2="90" y2="236" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="90" y="26" font-family="system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,&quot;Helvetica Neue&quot;,Arial,sans-serif" font-size="14.5" font-weight="600" fill="#1e293b" text-anchor="middle">ARM</text>
  <line x1="330" y1="38" x2="330" y2="236" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="330" y="26" font-family="system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,&quot;Helvetica Neue&quot;,Arial,sans-serif" font-size="14.5" font-weight="600" fill="#1e293b" text-anchor="middle">trigger 1</text>
  <line x1="470" y1="38" x2="470" y2="236" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="470" y="26" font-family="system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,&quot;Helvetica Neue&quot;,Arial,sans-serif" font-size="14.5" font-weight="600" fill="#1e293b" text-anchor="middle">trigger 2</text>
  <line x1="610" y1="38" x2="610" y2="236" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="610" y="26" font-family="system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,&quot;Helvetica Neue&quot;,Arial,sans-serif" font-size="14.5" font-weight="600" fill="#1e293b" text-anchor="middle">trigger 3</text>
  <line x1="90" y1="136" x2="330" y2="136" stroke="#475569" stroke-width="3"/>
  <line x1="90" y1="129" x2="90" y2="143" stroke="#475569" stroke-width="2"/>
  <line x1="330" y1="129" x2="330" y2="143" stroke="#475569" stroke-width="2"/>
  <path d="M321,131 L329,136 L321,141" fill="none" stroke="#475569" stroke-width="2"/>
  <text x="210.0" y="126" font-family="SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="15" font-weight="600" fill="#475569" text-anchor="middle">wait for trigger 1</text>
  <text x="210.0" y="156" font-family="system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,&quot;Helvetica Neue&quot;,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#64748b" text-anchor="middle">(Armed: only total_ms limits it)</text>
  <line x1="330" y1="136" x2="470" y2="136" stroke="#b91c1c" stroke-width="3"/>
  <line x1="330" y1="129" x2="330" y2="143" stroke="#b91c1c" stroke-width="2"/>
  <line x1="470" y1="129" x2="470" y2="143" stroke="#b91c1c" stroke-width="2"/>
  <path d="M461,131 L469,136 L461,141" fill="none" stroke="#b91c1c" stroke-width="2"/>
  <text x="400.0" y="126" font-family="SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="15" font-weight="600" fill="#b91c1c" text-anchor="middle">gap 1</text>
  <line x1="470" y1="136" x2="610" y2="136" stroke="#b91c1c" stroke-width="3"/>
  <line x1="470" y1="129" x2="470" y2="143" stroke="#b91c1c" stroke-width="2"/>
  <line x1="610" y1="129" x2="610" y2="143" stroke="#b91c1c" stroke-width="2"/>
  <path d="M601,131 L609,136 L601,141" fill="none" stroke="#b91c1c" stroke-width="2"/>
  <text x="540.0" y="126" font-family="SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="15" font-weight="600" fill="#b91c1c" text-anchor="middle">gap 2</text>
  <text x="470.0" y="174" font-family="system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,&quot;Helvetica Neue&quot;,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#64748b" text-anchor="middle">each gap &lt; trigger_timeout_ms (sim: gap = pulse_interval_ms)</text>
  <line x1="90" y1="222" x2="780" y2="222" stroke="#b91c1c" stroke-width="3"/>
  <line x1="90" y1="215" x2="90" y2="229" stroke="#b91c1c" stroke-width="2"/>
  <line x1="780" y1="215" x2="780" y2="229" stroke="#b91c1c" stroke-width="2"/>
  <path d="M771,217 L779,222 L771,227" fill="none" stroke="#b91c1c" stroke-width="2"/>
  <text x="435.0" y="212" font-family="SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="15" font-weight="600" fill="#b91c1c" text-anchor="middle">total_ms</text>
  <text x="792" y="226" font-family="system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,&quot;Helvetica Neue&quot;,Arial,sans-serif" font-size="14" font-weight="400" fill="#64748b" text-anchor="start">ARM to the last pulse</text>
  <line x1="24" y1="264" x2="50" y2="264" stroke="#b91c1c" stroke-width="3"/>
  <text x="58" y="268" font-family="system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,&quot;Helvetica Neue&quot;,Arial,sans-serif" font-size="14" font-weight="400" fill="#64748b" text-anchor="start">runs out: the whole run STOPS</text>
  <line x1="304.4" y1="264" x2="330.4" y2="264" stroke="#475569" stroke-width="3"/>
  <text x="338.4" y="268" font-family="system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,&quot;Helvetica Neue&quot;,Arial,sans-serif" font-size="14" font-weight="400" fill="#64748b" text-anchor="start">a wait, not a timeout</text>
</svg>
