  <text x="16" y="290" font-family="system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,&quot;Helvetica Neue&quot;,Arial,sans-serif" font-size="14.5" font-weight="600" fill="#1e293b" text-anchor="start">no edge ever comes</text>
  <text x="16" y="308" font-family="system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,&quot;Helvetica Neue&quot;,Arial,sans-serif" font-size="13" font-weight="400" fill="#64748b" text-anchor="start">was: shot_wait_timeout_s</text>
  <rect x="300" y="273" width="416.0" height="36" rx="5" fill="none" stroke="#b45309" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="300" y1="291.0" x2="778.4" y2="291.0" stroke="#cbd5e1" stroke-width="1.5"/>
