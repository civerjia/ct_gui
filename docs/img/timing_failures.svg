  <text x="716" y="30" font-family="system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,&quot;Helvetica Neue&quot;,Arial,sans-serif" font-size="12" font-weight="400" fill="#64748b" text-anchor="middle">8 s</text>
