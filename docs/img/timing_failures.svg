  <text x="738.0" y="440" font-family="system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,&quot;Helvetica Neue&quot;,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#b45309" text-anchor="start">stop the sim train, then IDLE; rest skipped</text>
  <text x="16" y="502" font-family="system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,&quot;Helvetica Neue&quot;,Arial,sans-serif" font-size="13" font-weight="400" fill="#64748b" text-anchor="start">The window is the one per-filament limit: whatever has not happened by its end is caught there. trigger_timeout_ms stays</text>
