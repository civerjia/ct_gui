  <text x="16" y="218" font-family="system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,&quot;Helvetica Neue&quot;,Arial,sans-serif" font-size="14.5" font-weight="600" fill="#1e293b" text-anchor="start">on_armed hangs</text>
  <text x="16" y="236" font-family="system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,&quot;Helvetica Neue&quot;,Arial,sans-serif" font-size="13" font-weight="400" fill="#64748b" text-anchor="start">was: on_armed_timeout_s</text>
