  <text x="16" y="146" font-family="system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,&quot;Helvetica Neue&quot;,Arial,sans-serif" font-size="14.5" font-weight="600" fill="#1e293b" text-anchor="start">HOT, its turn comes late</text>
  <text x="16" y="164" font-family="system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,&quot;Helvetica Neue&quot;,Arial,sans-serif" font-size="13" font-weight="400" fill="#64748b" text-anchor="start">was: renewed timed VOLTAGE</text>
  <rect x="300" y="129" width="416.0" height="36" rx="5" fill="none" stroke="#b45309" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="300" y1="147.0" x2="778.4" y2="147.0" stroke="#cbd5e1" stroke-width="1.5"/>
