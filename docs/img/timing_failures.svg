  <text x="547.2" y="368" font-family="system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,&quot;Helvetica Neue&quot;,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#b91c1c" text-anchor="start">gap &gt; trigger_timeout_ms</text>
  <line x1="543.2" y1="342" x2="543.2" y2="384" stroke="#b91c1c" stroke-width="3"/>
  <text x="738.0" y="368" font-family="system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,&quot;Helvetica Neue&quot;,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#b91c1c" text-anchor="start">STOP (firmware) -- or skip the rest (Q2)</text>
  <text x="16" y="434" font-family="system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,&quot;Helvetica Neue&quot;,Arial,sans-serif" font-size="14.5" font-weight="600" fill="#1e293b" text-anchor="start">pulses outlast the window</text>
  <text x="16" y="452" font-family="system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,&quot;Helvetica Neue&quot;,Arial,sans-serif" font-size="13" font-weight="400" fill="#64748b" text-anchor="start">was: shot_wait_timeout_s</text>
