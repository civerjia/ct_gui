  <text x="586.0" y="296" font-family="system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,&quot;Helvetica Neue&quot;,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle">released, waiting for edges</text>
  <line x1="716.0" y1="270" x2="716.0" y2="312" stroke="#b45309" stroke-width="3"/>
  <text x="738.0" y="296" font-family="system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,&quot;Helvetica Neue&quot;,Arial,sans-serif" font-size="13.5" font-weight="600" fill="#b45309" text-anchor="start">back to IDLE, skipped; 2 in a row: STOP</text>
  <text x="16" y="362" font-family="system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,&quot;Helvetica Neue&quot;,Arial,sans-serif" font-size="14.5" font-weight="600" fill="#1e293b" text-anchor="start">edges stop half way</text>
  <text x="16" y="380" font-family="system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,&quot;Helvetica Neue&quot;,Arial,sans-serif" font-size="13" font-weight="400" fill="#64748b" text-anchor="start">kept: trigger_timeout_ms</text>
