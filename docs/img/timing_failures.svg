  <text x="352" y="30" font-family="system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,&quot;Helvetica Neue&quot;,Arial,sans-serif" font-size="12" font-weight="400" fill="#64748b" text-anchor="middle">1 s</text>
  <line x1="404" y1="36" x2="404" y2="502" stroke="#eef2f6" stroke-width="1"/>
  <text x="404" y="30" font-family="system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,&quot;Helvetica Neue&quot;,Arial,sans-serif" font-size="12" font-weight="400" fill="#64748b" text-anchor="middle">2 s</text>
  <line x1="456" y1="36" x2="456" y2="502" stroke="#eef2f6" stroke-width="1"/>
  <text x="456" y="30" font-family="system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,&quot;Helvetica Neue&quot;,Arial,sans-serif" font-size="12" font-weight="400" fill="#64748b" text-anchor="middle">3 s</text>
  <line x1="508" y1="36" x2="508" y2="502" stroke="#eef2f6" stroke-width="1"/>
  <text x="508" y="30" font-family="system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,&quot;Helvetica Neue&quot;,Arial,sans-serif" font-size="12" font-weight="400" fill="#64748b" text-anchor="middle">4 s</text>
  <line x1="560" y1="36" x2="560" y2="502" stroke="#eef2f6" stroke-width="1"/>
  <text x="560" y="30" font-family="system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,&quot;Helvetica Neue&quot;,Arial,sans-serif" font-size="12" font-weight="400" fill="#64748b" text-anchor="middle">5 s</text>
  <line x1="612" y1="36" x2="612" y2="502" stroke="#eef2f6" stroke-width="1"/>
  <text x="612" y="30" font-family="system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,&quot;Helvetica Neue&quot;,Arial,sans-serif" font-size="12" font-weight="400" fill="#64748b" text-anchor="middle">6 s</text>
