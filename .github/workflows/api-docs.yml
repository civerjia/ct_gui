# Rebuild the API reference on every push to main and publish it to GitHub
# Pages (https://civerjia.github.io/ct_gui/). Same generator as the local
# scripts/make_api_docs.sh, so the site is always the docstrings of the code
# that is on main -- nothing generated is committed.
name: api-docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CT_NO_AUTO_UPDATE: "1"   # importing the client must not try to self-update here
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pdoc
      - run: sh scripts/make_api_docs.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/api
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
